<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>News Website</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav>
    <div class="main-nav container flex">
      <a href="#" onclick="reload()" class="company-logo">
        <img src="assests/Broadcast.png" alt="Company logo"/>
      </a>
      <div class="nav-links">
        <ul class="flex">
          <li class="hover-link nav-item" id="IPL" onclick="onNavItemClick('IPL')">IPL</li>
          <li class="hover-link nav-item" id="Finance" onclick="onNavItemClick('Finance')">Finance</li>
          <li class="hover-link nav-item" id="Politics" onclick="onNavItemClick('Politics')">Politics</li>
        </ul>
      </div>
      <div class="search-bar">
        <input type="text" class="news-input" id="search-text" placeholder="Search e.g. Science" />
        <button class="search-button" id="search-button">Search</button>
      </div>
    </div>
  </nav>

  <main>
    <div id="cards-container" class="cards-container container flex">
      <!-- News cards injected here -->
    </div>
  </main>

  <template id="template-news-card">
    <div class="card">
      <div class="card-header">
        <img src="https://placehold.co/400x200" alt="news image" id="news-img" />
      </div>
      <div class="card-content">
        <h3 id="news-title">This is the Title</h3>
        <h6 class="news-source" id="news-source">End Gadget 26/04/2025</h6>
        <p class="news-desc" id="news-desc">Lorem ipsum dolor sit amet.</p>
      </div>
    </div>
  </template>
  <footer class="footer">
    <div class="container flex footer-content">
      <p>© 2025 Your News Website</p>
      <div class="social-links">
        <a href="https://www.linkedin.com/in/archana-bisht-47a4442bb/" target="_blank" aria-label="LinkedIn">
          <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/linkedin.svg" alt="LinkedIn" class="social-icon" />
        </a>
        <a href="https://www.instagram.com/__archana_bisht?igsh=eG4xOWE5OW5wdmlj" target="_blank" aria-label="Instagram">
          <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/instagram.svg" alt="Instagram" class="social-icon" />
        </a>
      </div>
    </div>
  </footer>
  

  <script src="script.js"></script>
</body>
</html>
